name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    schedule:
        - cron: 0 6 * * 1

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    checks: write
    pull-requests: write
    actions: read

jobs:
    quality:
        name: Quality
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: npm
            - name: Reapply immutable bit on audit-suppressions.ts (AGENTS §18)
              run: chattr +i scripts/audit-suppressions.ts || echo "chattr unavailable (non-fatal on this runner)"
            - name: Verify audit-suppressions.ts immutable bit
              run: lsattr scripts/audit-suppressions.ts
            - run: npm ci
            - run: npm run typecheck
            - name: Security vigilant scan
              run: |
                  VIGILANT="npx tsx scripts/rule-vigilant.ts"
                  FAIL=0
                  for f in eslint.config.mjs .dependency-cruiser.js .gitleaks.toml AGENTS.md scripts/quality-check.ts scripts/audit-suppressions.ts; do
                    if [ -f "$f" ]; then
                      COUNT=$($VIGILANT --file "$f" --json | npx tsx -e "import { readFileSync } from 'fs'; const d = JSON.parse(readFileSync(0,'utf-8')); process.stdout.write(String(d.length));")
                      echo "  $f: $COUNT warning(s)"
                      [ "$COUNT" -gt 0 ] && FAIL=1
                    fi
                  done
                  [ "$FAIL" -eq 0 ] || exit 1
            - run: npm run lint
            - run: npm run unused-exports
            - run: npm run depcruise
            - run: npm run type-coverage
            - name: Install gitleaks
              run: |
                  GITLEAKS_VERSION="8.24.3"
                  curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
            - run: npm run gitleaks
            - name: Install osv-scanner
              run: |
                  OSV_VERSION="2.4.0"
                  curl -sSL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
                  sudo install -m 755 /tmp/osv-scanner /usr/local/bin/osv-scanner
                  osv-scanner --version
            - run: npm run osv-scan
            - name: Snyk test
              if: env.SNYK_TOKEN != ''
              run: npm run snyk-test
            - name: Check mock chains
              run: npx tsx scripts/check-mock-chains.ts
            - name: Validation hook (committed copy exists)
              run: test -f .config/validation_hook.ts && echo "validation_hook.ts committed copy present"
            - name: Validation hook (if installed)
              run: |
                  HOOK="$HOME/.config/opencode/validation_hook.ts"
                  if [ -f "$HOOK" ]; then
                    npx tsx "$HOOK" --test
                  else
                    echo "validation_hook.ts not found — skipping (only available on dev machines)"
                  fi

    semgrep:
        name: Semgrep (suppression detection)
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Install Semgrep (version pinned in .semgrep/version)
              run: pip install "semgrep==$(cat .semgrep/version)"
            - name: Run Semgrep on diff (turnstile)
              run: npx tsx scripts/run-semgrep.ts --diff

    no-swallow:
        name: No-swallow (catch suppression, diff only)
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - name: Run no-swallow detector on diff (turnstile)
              run: npx tsx scripts/run-noswallow.ts

    test:
        name: Test (Node ${{ matrix.node-version }})
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22, 24]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm audit --audit-level=high
            - name: Check outdated dependencies (warning only)
              run: npm outdated --json || true
            - name: Tests with coverage (Node 22 only)
              if: matrix.node-version == 22
              run: npx vitest run --coverage --testTimeout=120000
            - name: Tests without coverage (Node 24+)
              if: matrix.node.version != 22
              run: npx vitest run --testTimeout=120000
            - name: Upload test report for post-processing
              if: always() && matrix.node-version == 22
              uses: actions/upload-artifact@v7
              with:
                  name: test-report
                  path: reports/
                  if-no-files-found: warn

    post-process:
        if: always() && github.event_name != 'schedule'
        needs: test
        uses: ./.github/workflows/qa-post-process.yml
        with:
            project-name: qa_tools

    mutation-setup:
        name: Mutation Setup (bucket coverage validation)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            buckets: ${{ steps.emit-buckets.outputs.buckets }}
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - name: Validate bucket partition covers every source file (Rule 25)
              run: |
                  npx tsx scripts/mutation-buckets.ts --validate $(git ls-files)
            - name: Emit bucket matrix from the canonical registry
              id: emit-buckets
              run: |
                  BUCKETS=$(npx tsx scripts/mutation-buckets.ts --json)
                  echo "buckets=${BUCKETS}" >> "$GITHUB_OUTPUT"

    mutation:
        name: Mutation Testing (${{ matrix.bucket.name }})
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
        runs-on: ubuntu-latest
        needs: [quality, mutation-setup]
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                bucket: ${{ fromJSON(needs.mutation-setup.outputs.buckets) }}
        env:
            # Stryker roda o vitest in-process; o vitest.config.ts desativa o
            # vitest-affected durante a mutação (determinismo do score) quando
            # STRYKER_ACTIVE=true — mecanismo real, não mais a chave `env`
            # ignorada pelo Stryker (ver dev/docs/internal/MUTATION-TESTING-PERF.md).
            STRYKER_ACTIVE: 'true'
            # Worker nunca falha sozinho (score por bucket é parcial); o gate
            # agregado (job mutation-gate) aplica o break real 60 no score
            # combinado. Config env-driven via stryker.config.mjs (Estratégia B).
            STRYKER_BREAK: '0'
            STRYKER_REPORT_FILE: reports/mutation/mutation-report-${{ matrix.bucket.name }}.json
        permissions:
            # Least privilege: checkout (contents) + upload de artefato
            # (actions). pull-requests/checks write eram do tautest (removido).
            contents: read
            actions: write
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - name: Compute diff-scoped mutation scope
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    MUTATION_BASE=${{ github.event.pull_request.base.sha }}
                  else
                    MUTATION_BASE=HEAD~1
                  fi
                  # Exit 2 = bucket sem arquivos-fonte com linhas adicionadas
                  # (PR de teste/doc ou commit de deleção) → skip do bucket.
                  # set -e é o default no GH Actions: desativa temporariamente
                  # para capturar o exit code (senão o bash aborta antes do check).
                  set +e
                  MUTATE_SCOPE=$(npx tsx scripts/mutation-scope.ts --base "${MUTATION_BASE}" --dir "${{ matrix.bucket.specs }}")
                  SCOPE_EXIT=$?
                  set -e
                  if [ "$SCOPE_EXIT" -eq 2 ]; then
                    echo "No production files changed in this bucket — skipping mutation testing"
                    exit 0
                  fi
                  if [ "$SCOPE_EXIT" -ne 0 ]; then
                    echo "mutation-scope failed with exit code ${SCOPE_EXIT}"
                    exit "$SCOPE_EXIT"
                  fi
                  echo "MUTATE_SCOPE=${MUTATE_SCOPE}" >> "$GITHUB_ENV"
            - name: Run diff-scoped mutation testing (bucket)
              run: npx stryker run stryker.config.mjs --mutate "${MUTATE_SCOPE}"
            - name: Upload mutation report (bucket)
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: mutation-report-${{ matrix.bucket.name }}
                  path: reports/mutation/mutation-report-${{ matrix.bucket.name }}.json
                  if-no-files-found: warn

    mutation-gate:
        name: Mutation Gate (combined score)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
        runs-on: ubuntu-latest
        needs: mutation
        timeout-minutes: 15
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - name: Download bucket mutation reports
              uses: actions/download-artifact@v7
              with:
                  pattern: mutation-report-*
                  path: reports/mutation/
                  merge-multiple: true
            - name: Merge bucket reports and enforce combined break
              run: |
                  shopt -s nullglob
                  REPORTS=(reports/mutation/mutation-report-*.json)
                  if [ "${#REPORTS[@]}" -eq 0 ]; then
                    echo "No bucket reports produced (no production files changed) — skipping mutation gate"
                    exit 0
                  fi
                  npx tsx scripts/merge-mutation-reports.ts --break 60 --output reports/mutation/mutation-report-combined.json "${REPORTS[@]}"
